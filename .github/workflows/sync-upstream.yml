name: Sync with upstream

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/9seconds/mtg.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for new commits
        id: check
        run: |
          COUNT=$(git rev-list --count HEAD..upstream/master)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Upstream is $COUNT commits ahead"

      - name: Merge upstream
        if: steps.check.outputs.count != '0'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/master --no-edit
        continue-on-error: true

      - name: Push if merge succeeded
        if: steps.check.outputs.count != '0' && steps.merge.outcome == 'success'
        run: git push origin master

      - name: Report conflict (one open issue, commented on repeats)
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          AHEAD: ${{ steps.check.outputs.count }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'sync', per_page: 1,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number,
                body: `Still conflicting: upstream is ${process.env.AHEAD} commits ahead (${new Date().toISOString().slice(0, 10)}).`,
              });
              return;
            }
            await github.rest.issues.create({
              owner, repo,
              title: 'Upstream sync failed — merge conflict',
              body: 'Automatic merge from `9seconds/mtg:master` failed due to conflicts.\n\nResolve manually on a branch and open a PR:\n```\ngit fetch upstream\ngit switch -c sync/upstream-$(date +%F) master\ngit merge upstream/master\n# fix conflicts, go build ./... && go test ./...\ngit push -u origin HEAD\n```\nThis issue is closed automatically by the next successful sync; repeat failures are added as comments here.',
              labels: ['sync'],
            });

      - name: Close open sync issues after a successful sync
        if: steps.check.outputs.count != '0' && steps.merge.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'sync',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: 'Upstream merged cleanly; closing.',
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }
